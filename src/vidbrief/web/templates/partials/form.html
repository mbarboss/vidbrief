<form class="card" id="summary-form" method="post" action="/summaries" hx-post="/summaries" hx-target="#url-error" hx-swap="innerHTML" hx-disabled-elt="find button[type='submit']" novalidate>
  <input type="hidden" name="{{ csrf_field }}" value="{{ csrf_token }}">
  <div class="field">
    <div class="field-label"><label for="url">Video link</label><span class="mono">youtube.com · youtu.be</span></div>
    <div class="url">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      <input id="url" name="url" type="url" inputmode="url" placeholder="youtube.com/watch?v=..." autocomplete="off" spellcheck="false" required aria-describedby="url-error">
      <button class="paste" type="button" data-paste hidden>Paste</button>
    </div>
    <p class="err" id="url-error" role="alert">{{ error or "" }}</p>
  </div>
  <fieldset class="langs">
    <legend class="field-label">Summary language</legend>
    <div class="chips">
      {% for option in languages %}
      <label class="chip"><input type="radio" name="language" value="{{ option.code }}"{% if option.code == selected_language %} checked{% endif %}><span lang="{{ option.code }}">{{ option.label }}{% if option.region %} <i>{{ option.region }}</i>{% endif %}</span></label>
      {% endfor %}
    </div>
  </fieldset>
  <div class="actions-row">
    <button class="btn btn-primary" type="submit"><span class="spinner" aria-hidden="true"></span>Summarize <kbd>Enter</kbd></button>
    <span class="hint">Live streams can be summarized once they end.</span>
  </div>
</form>
