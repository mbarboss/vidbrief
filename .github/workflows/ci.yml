name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow only needs to read the code.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (hooks, secrets, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Run every pre-commit hook
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Audit dependencies
        run: uv run poe audit

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest supported version and the newest release.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # ffmpeg is installed the way the README tells users to, which also checks those steps.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      # The real-ffmpeg tests skip themselves when ffmpeg is missing; failing here keeps
      # them from being skipped silently.
      - name: Check ffmpeg
        run: ffmpeg -version
      - name: Install dependencies
        run: uv sync --locked
      - name: Type check
        run: uv run poe typecheck
      - name: Test
        run: uv run poe test
      - name: Smoke test the command
        run: uv run vidbrief --help

  docker:
    name: Docker image (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag vidbrief:ci .
      # Starting at all means ffmpeg, ffprobe and Deno were found; the key is random because
      # nothing here calls Groq.
      - name: Start the container the way compose.yaml does
        run: >-
          docker run --detach --name vidbrief --read-only --tmpfs /tmp --cap-drop ALL
          --security-opt no-new-privileges:true --publish 127.0.0.1:8000:8000
          --env GROQ_API_KEY="gsk_$(openssl rand -hex 26)"
          vidbrief:ci
      - name: Wait until the container is healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' vidbrief)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs vidbrief
          exit 1
      - name: Check the published app
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8000/healthz)" = 400
          test "$(docker exec vidbrief id -u)" = 10001
      - name: Show the logs on failure
        if: failure()
        run: docker logs vidbrief
